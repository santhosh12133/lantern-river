<title>Lantern River</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one full-screen canvas river, a slim HUD strip on top, a centered card for start / game over. Single committed night look. */
:root {
  --night: #07141c;
  --water: #0d2430;
  --bank: #050d0a;
  --lantern: #ffb84d;
  --firefly: #d9ff7a;
  --ink: #e9f1ee;
  --muted: #8aa39f;
  --danger: #ff6f5e;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night); color: var(--ink);
  font-family: var(--display); overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#game { position: relative; height: 100%; width: 100%; }
canvas { display: block; width: 100%; height: 100%; }
.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--mono); font-size: 13px; color: var(--muted);
  pointer-events: none;
}
.hud b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { display: flex; align-items: center; gap: 8px; flex: 1 1 160px; max-width: 280px; }
.bar { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.fill { height: 100%; width: 100%; background: var(--lantern); border-radius: 4px; transition: background .2s; }
.fill.low { background: var(--danger); }
.card {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(380px, calc(100% - 32px));
  background: rgba(7, 20, 28, .88); border: 1px solid rgba(255, 184, 77, .25);
  border-radius: 14px; padding: 28px 24px; text-align: center;
  display: flex; flex-direction: column; gap: 14px; align-items: center;
  backdrop-filter: blur(4px);
}
.card h1 {
  margin: 0; font-size: clamp(34px, 9vw, 48px); font-weight: 800; letter-spacing: -.02em;
  line-height: 1; color: var(--lantern); text-wrap: balance;
}
.card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; max-width: 32ch; }
.card .result { font-family: var(--mono); color: var(--ink); font-size: 15px; }
.card .result b { color: var(--firefly); }
.keys { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
button {
  font: 800 17px var(--display); color: var(--night); background: var(--lantern);
  border: 0; border-radius: 999px; padding: 12px 30px; cursor: pointer;
}
button:hover { filter: brightness(1.08); }
button:focus-visible { outline: 3px solid var(--firefly); outline-offset: 3px; }
</style>

<div id="game">
  <canvas id="c"></canvas>
  <div class="hud">
    <span>Downstream <b id="dist">0</b> m</span>
    <span>Fireflies <b id="flies">0</b></span>
    <span class="meter">Light <span class="bar"><span class="fill" id="fill"></span></span></span>
    <span>Best <b id="best">0</b></span>
  </div>
  <div class="card" id="card">
    <h1 id="cardTitle">Lantern River</h1>
    <p id="cardText">Your lantern is burning down. Catch fireflies to keep it lit, and steer around the rocks hiding in the dark.</p>
    <div class="result" id="result" hidden></div>
    <button id="startBtn" type="button">Push off</button>
    <div class="keys">← → or A D to steer · drag on touch screens</div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const card = $('card'), fillEl = $('fill');
  let W = 0, H = 0;

  function resize() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  let best = 0;
  try { best = +localStorage.getItem('lantern-best') || 0; } catch (e) {}
  $('best').textContent = best;

  const S = {};
  function reset() {
    Object.assign(S, {
      mode: 'play', t: 0, dist: 0, speed: 150, light: 100, flies: 0,
      boat: { x: W / 2, vx: 0 }, rocks: [], bugs: [], sparks: [],
      rockTimer: 1.2, bugTimer: 0.4, inv: 0, shake: 0
    });
  }
  reset(); S.mode = 'ready';

  // River banks wander with the distance travelled.
  function margin(sy) {
    const p = (sy - S.dist) * 1;
    return W * 0.1 + Math.sin(p * 0.004) * W * 0.04 + Math.sin(p * 0.011 + 1.3) * W * 0.02 + 8;
  }
  const leftAt = sy => margin(sy);
  const rightAt = sy => W - margin(sy + 371);

  const boatY = () => H * 0.78;

  // Input
  const keys = {};
  let pointerX = null;
  addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ((e.key === ' ' || e.key === 'Enter') && S.mode !== 'play') { e.preventDefault(); start(); }
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  cv.addEventListener('pointerdown', e => { pointerX = e.clientX - cv.getBoundingClientRect().left; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (pointerX !== null) pointerX = e.clientX - cv.getBoundingClientRect().left; });
  const up = () => { pointerX = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  $('startBtn').addEventListener('click', start);

  function start() { reset(); card.hidden = true; }

  function spawnRock() {
    const y = -50, l = leftAt(y) + 24, r = rightAt(y) - 24;
    const rad = 14 + Math.random() * 18;
    const pts = [];
    const n = 7 + (Math.random() * 4 | 0);
    for (let i = 0; i < n; i++) pts.push(0.75 + Math.random() * 0.35);
    S.rocks.push({ x: l + Math.random() * (r - l), y, r: rad, pts, rot: Math.random() * 6 });
  }
  function spawnBug() {
    const y = -30, l = leftAt(y) + 20, r = rightAt(y) - 20;
    const count = Math.random() < 0.3 ? 3 : 1;
    const cx = l + Math.random() * (r - l);
    for (let i = 0; i < count; i++) {
      S.bugs.push({ x: cx + (i - 1) * 26 * (count > 1), y: y - i * 22, ph: Math.random() * 6, drift: 0.5 + Math.random() });
    }
  }

  function gameOver() {
    S.mode = 'over';
    const score = Math.floor(S.dist / 10) + S.flies * 10;
    const isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('lantern-best', best); } catch (e) {} }
    $('best').textContent = best;
    $('cardTitle').textContent = 'Your lantern went out';
    $('cardText').textContent = isBest ? 'New best run. The river remembers.' : 'The river is long. Try again.';
    const res = $('result');
    res.hidden = false;
    res.innerHTML = `${Math.floor(S.dist / 10)} m + ${S.flies} fireflies × 10 = <b>${score}</b> points`;
    $('startBtn').textContent = 'Light it again';
    card.hidden = false;
    $('startBtn').focus();
  }

  function update(dt) {
    S.t += dt;
    if (S.mode !== 'play') { S.dist += 40 * dt; return; }
    S.speed = Math.min(430, 150 + S.dist * 0.012);
    S.dist += S.speed * dt;

    // Steering
    const b = S.boat, by = boatY();
    let dir = 0;
    if (keys['arrowleft'] || keys['a']) dir -= 1;
    if (keys['arrowright'] || keys['d']) dir += 1;
    if (pointerX !== null) {
      const diff = pointerX - b.x;
      b.vx += (diff * 9 - b.vx) * Math.min(1, dt * 10);
    } else {
      b.vx += dir * 1500 * dt;
      b.vx *= Math.pow(0.02, dt);
    }
    b.x += b.vx * dt;
    const l = leftAt(by) + 16, r = rightAt(by) - 16;
    if (b.x < l) { b.x = l; b.vx = 0; }
    if (b.x > r) { b.x = r; b.vx = 0; }

    // Lantern burns down faster as the current picks up
    S.light -= (5 + S.speed / 110) * dt;

    // Spawning
    S.rockTimer -= dt;
    if (S.rockTimer <= 0) { spawnRock(); S.rockTimer = Math.max(0.32, 1.15 - S.dist / 7000) * (0.7 + Math.random() * 0.6); }
    S.bugTimer -= dt;
    if (S.bugTimer <= 0) { spawnBug(); S.bugTimer = 0.9 + Math.random() * 0.9; }

    const move = S.speed * dt;
    for (const k of S.rocks) k.y += move;
    for (const f of S.bugs) { f.y += move * 0.92; f.x += Math.sin(S.t * 2 * f.drift + f.ph) * 30 * dt; }
    for (const p of S.sparks) { p.x += p.vx * dt; p.y += p.vy * dt + move * 0.5; p.life -= dt; }

    // Collisions
    S.inv = Math.max(0, S.inv - dt);
    S.shake = Math.max(0, S.shake - dt * 3);
    for (const k of S.rocks) {
      if (S.inv > 0) break;
      if (Math.hypot(k.x - b.x, k.y - by) < k.r * 0.85 + 12) {
        S.light -= 28; S.inv = 1.2; S.shake = 1; k.hit = true;
        b.vx = (b.x < k.x ? -1 : 1) * 260;
      }
    }
    S.bugs = S.bugs.filter(f => {
      if (Math.hypot(f.x - b.x, f.y - (by - 18)) < 30) {
        S.light = Math.min(100, S.light + 16); S.flies++;
        for (let i = 0; i < 10; i++) {
          const a = Math.random() * 6.28, s = 40 + Math.random() * 90;
          S.sparks.push({ x: f.x, y: f.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 });
        }
        return false;
      }
      return f.y < H + 40;
    });
    S.rocks = S.rocks.filter(k => k.y < H + 60);
    S.sparks = S.sparks.filter(p => p.life > 0);

    if (S.light <= 0) { S.light = 0; gameOver(); }
  }

  function drawBanks() {
    ctx.fillStyle = '#050d0a';
    for (const side of [0, 1]) {
      ctx.beginPath();
      ctx.moveTo(side ? W : 0, -10);
      for (let y = -10; y <= H + 10; y += 12) ctx.lineTo(side ? rightAt(y) : leftAt(y), y);
      ctx.lineTo(side ? W : 0, H + 10);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(120, 170, 150, .18)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let y = -10; y <= H + 10; y += 12) {
        const x = side ? rightAt(y) : leftAt(y);
        y === -10 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  function drawRipples() {
    ctx.strokeStyle = 'rgba(150, 200, 210, .10)'; ctx.lineWidth = 1.5;
    const gap = 46, off = S.dist % gap;
    for (let row = -1; row < H / gap + 1; row++) {
      const y = row * gap + off;
      const seed = Math.floor((S.dist - off) / gap) - row;
      for (let i = 0; i < 4; i++) {
        const h = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453;
        const fr = h - Math.floor(h);
        const x = W * 0.12 + fr * W * 0.76;
        ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.quadraticCurveTo(x, y - 3, x + 10, y); ctx.stroke();
      }
    }
  }

  function drawRock(k) {
    ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.rot);
    ctx.fillStyle = k.hit ? '#3d4a50' : '#33454d';
    ctx.beginPath();
    k.pts.forEach((m, i) => {
      const a = i / k.pts.length * Math.PI * 2;
      const x = Math.cos(a) * k.r * m, y = Math.sin(a) * k.r * m;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(200, 230, 240, .25)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    // foam ring
    ctx.strokeStyle = 'rgba(200, 230, 240, .12)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(k.x, k.y - 4, k.r * 1.15, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  }

  function drawDark() {
    const by = boatY();
    const R = 60 + S.light * 2.4 + Math.sin(S.t * 9) * 3;
    const g = ctx.createRadialGradient(S.boat.x, by - 18, 10, S.boat.x, by - 18, R);
    g.addColorStop(0, 'rgba(255, 184, 77, .10)');
    g.addColorStop(0.55, 'rgba(4, 10, 14, .35)');
    g.addColorStop(1, 'rgba(3, 8, 12, .96)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBugs() {
    for (const f of S.bugs) {
      const flick = 0.6 + 0.4 * Math.sin(S.t * 8 + f.ph * 3);
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 16);
      g.addColorStop(0, `rgba(217, 255, 122, ${0.9 * flick})`);
      g.addColorStop(1, 'rgba(217, 255, 122, 0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 16, 0, 7); ctx.fill();
      ctx.fillStyle = '#f4ffd6'; ctx.beginPath(); ctx.arc(f.x, f.y, 2.2, 0, 7); ctx.fill();
    }
    for (const p of S.sparks) {
      ctx.fillStyle = `rgba(217, 255, 122, ${p.life / 0.6})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 7); ctx.fill();
    }
  }

  function drawBoat() {
    const x = S.boat.x, y = boatY();
    if (S.inv > 0 && Math.floor(S.t * 14) % 2) return;
    const tilt = Math.max(-0.35, Math.min(0.35, S.boat.vx / 900));
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
    // wake
    ctx.strokeStyle = 'rgba(200, 230, 240, .22)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(-20, 34); ctx.moveTo(10, 10); ctx.lineTo(20, 34); ctx.stroke();
    // paper hull
    ctx.fillStyle = '#efe6d2';
    ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.lineTo(11, 12); ctx.lineTo(-11, 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d6cbb2';
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(0, -16); ctx.lineTo(9, 0); ctx.closePath(); ctx.fill();
    // lantern
    const glow = ctx.createRadialGradient(0, -22, 0, 0, -22, 26);
    glow.addColorStop(0, `rgba(255, 184, 77, ${0.35 + S.light / 200})`);
    glow.addColorStop(1, 'rgba(255, 184, 77, 0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, -22, 26, 0, 7); ctx.fill();
    ctx.fillStyle = S.light > 25 ? '#ffb84d' : '#ff8a5c';
    ctx.beginPath(); ctx.ellipse(0, -22, 6, 8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3d6'; ctx.beginPath(); ctx.arc(0, -22, 2.5, 0, 7); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - .5) * 10 * S.shake, (Math.random() - .5) * 10 * S.shake);
    ctx.fillStyle = '#0d2430'; ctx.fillRect(-10, -10, W + 20, H + 20);
    drawRipples();
    for (const k of S.rocks) drawRock(k);
    drawBanks();
    drawDark();
    drawBugs();
    drawBoat();
    ctx.restore();

    $('dist').textContent = Math.floor(S.dist / 10);
    $('flies').textContent = S.flies;
    fillEl.style.width = S.light + '%';
    fillEl.classList.toggle('low', S.light < 25);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
